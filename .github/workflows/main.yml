name: GovSecure CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Run Jest Test Suite
      env:
        NODE_ENV: test
        SKIP_EMAIL: 'true'
        JWT_SECRET: ci-test-secret
      run: npm test

  docker-build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: test # Only build if tests pass
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker Image
      run: docker build -t govsecure/portal:latest .
      
    - name: Test Docker Container Startup
      run: |
        docker rm -f govsecure || true
        docker run -d -p 3000:3000 \
          -e SKIP_EMAIL=true \
          -e NODE_ENV=production \
          -e JWT_SECRET=ci-test-secret \
          --name govsecure govsecure/portal:latest

        for i in $(seq 1 30); do
          if curl -sf http://localhost:3000/health; then
            echo "Docker container is ready."
            docker stop govsecure
            docker rm govsecure
            exit 0
          fi
          if [ -z "$(docker ps -q -f name=govsecure)" ]; then
            echo "Container exited unexpectedly:"
            docker logs govsecure
            exit 1
          fi
          echo "Waiting for container startup... ($i/30)"
          sleep 3
        done

        echo "Container failed health check:"
        docker logs govsecure
        docker stop govsecure || true
        docker rm govsecure || true
        exit 1

name: GovSecure CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Run Jest Test Suite
      env:
        NODE_ENV: test
      run: npm test

  docker-build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: test # Only build if tests pass
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker Image
      run: docker build -t govsecure/portal:latest .
      
    - name: Test Docker Container Startup
      run: |
        docker rm -f govsecure || true
        docker run -d -p 3000:3000 --name govsecure govsecure/portal:latest
        for i in $(seq 1 12); do
          if curl -f http://localhost:3000; then
            echo "Docker container is ready.";
            break;
          fi
          echo "Waiting for container startup... ($i/12)";
          sleep 5;
        done
        curl -f http://localhost:3000
        docker stop govsecure
        docker rm govsecure

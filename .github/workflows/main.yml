name: GovSecure CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Run Jest Test Suite
      env:
        NODE_ENV: test
        SKIP_EMAIL: 'true'
        JWT_SECRET: ci-test-secret
      run: npm test

  docker-build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: test # Only build if tests pass
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker Image
      run: docker build -t govsecure/portal:latest .
      
    - name: Test Docker Container Startup
      run: |
        set -e
        docker rm -f govsecure 2>/dev/null || true

        if ! docker run -d --name govsecure -p 3000:3000 \
          -e SKIP_EMAIL=true \
          -e NODE_ENV=production \
          -e JWT_SECRET=ci-test-secret \
          -e PORT=3000 \
          govsecure/portal:latest
        then
          echo "::error::docker run failed — no container was created (check build output)."
          exit 1
        fi

        cleanup() {
          docker rm -f govsecure 2>/dev/null || true
        }

        for i in $(seq 1 40); do
          if curl -sfS --connect-timeout 2 --max-time 8 "http://127.0.0.1:3000/health" >/dev/null; then
            echo "Docker container is ready."
            cleanup
            exit 0
          fi

          if ! docker inspect govsecure >/dev/null 2>&1; then
            echo "::error::Container govsecure disappeared."
            exit 1
          fi

          status=$(docker inspect -f '{{.State.Status}}' govsecure)
          if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
            echo "::error::Container stopped (status=$status). Logs:"
            docker logs govsecure 2>&1 || true
            cleanup
            exit 1
          fi
          if [ "$status" = "restarting" ] && [ "$i" -ge 25 ]; then
            echo "::error::Container stuck restarting. Logs:"
            docker logs govsecure 2>&1 || true
            cleanup
            exit 1
          fi

          echo "Waiting for container startup... ($i/40)"
          sleep 2
        done

        echo "::error::Health check timed out. Logs:"
        docker logs govsecure 2>&1 || true
        cleanup
        exit 1

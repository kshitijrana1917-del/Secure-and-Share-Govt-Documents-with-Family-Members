# Render Blueprint: https://render.com/docs/blueprint-spec
# Set EMAIL_USER and EMAIL_PASS in the Render dashboard (never commit real values).
version: "1"
services:
  - type: web
    name: govsecure
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Auto-deploy on push to main
    autoDeploy: true
    # Increase timeout to give server enough time to start
    healthCheck:
      path: /health
      interval: 10
      timeout: 5
      unhealthyThreshold: 5
      healthyThreshold: 2
      initialDelay: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_CONSOLE
        value: "true"
      - key: DATABASE_PATH
        value: /usr/src/app/data/database.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SKIP_EMAIL=true
      - DATABASE_PATH=/usr/src/app/data/database.sqlite
    volumes:
      - app_data:/usr/src/app/uploads
      - db_data:/usr/src/app/data
    restart: unless-stopped

volumes:
  app_data:
  db_data:
